name: Publish revised B1813 introduction
on:
  push:
    branches: [b1813-intro-package-20261128]
    paths: ['.github/workflows/package-b1813.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the Word document and six photographs
        run: |
          set -eu
          mkdir -p downloads
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo
          with ZipFile("downloads/B1813-intro.zip","w") as z:
              for n in ["土地科学与技术学院+B1813宿舍+整体介绍.docx","图片原图/01 六人宿舍横版合影（处理版）.png","图片原图/02 思想学习与团日活动.jpeg","图片原图/03 学科互助与竞赛科研.png","图片原图/04 奖学金与集体荣誉.png","图片原图/05 志愿服务与社会实践.png","图片原图/06 六位舍友与专业介绍.png"]:
                  z.writestr(ZipInfo(n,(2026,11,28,0,0,0)),Path(n).read_bytes())
          PY
          echo 'f66571d7d6e40f89c38627de7574efb7685502d8a224adb7af696fad8d5ffc29  downloads/B1813-intro.zip' | sha256sum -c -
          cp downloads/B1813-intro.zip "downloads/土地科学与技术学院+B1813宿舍+整体介绍.zip"
          git add downloads/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish updated four-section dormitory introduction'
          git push origin HEAD:b1813-intro-package-20261128
